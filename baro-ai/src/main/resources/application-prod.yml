server:
  port: ${SERVER_PORT:8092}

api:
  v1: /api/v1

spring:
  application:
    name: ai-service
  config:
    import:
      - classpath:review-sentiment.yml
      - classpath:review-negative-keywords.yml
      - classpath:recipe-recommend.yml
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  # Elasticsearch 설정
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ai-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest  # earliest에서 latest로 변경하여 오래된 메시지 건너뛰기
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Spring AI 설정 (Google Gemini — 근거: docs/decisions/003-gemini-migration.md)
  # 타임아웃·재시도는 spring.ai.retry.*가 아니라 LlmClientConfig가 Gemini SDK 클라이언트에 직접 건다.
  # spring.ai.retry.*는 SDK가 던지는 429·5xx 예외에 반응하지 않는 죽은 설정이라 두지 않는다.
  ai:
    google:
      genai:
        api-key: ${BARO_AI_GEMINI_KEY:}
        chat:
          options:
            model: ${SPRING_AI_GEMINI_MODEL:gemini-2.5-flash-lite}
            # 레시피 후보 생성용 기본값. 결정적 추출이 필요한 호출은 호출부에서 0으로 덮어쓴다
            temperature: 0.7
        embedding:
          api-key: ${BARO_AI_GEMINI_KEY:}
          text:
            options:
              model: ${SPRING_AI_GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              # ES 매핑(dims=1536)을 유지하려고 출력 차원을 고정한다
              dimensions: 1536

eureka:
  client:
    enabled: false

# 로깅 설정
logging:
  level:
    root: INFO
    com.barofarm.ai: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.kafka: INFO  # Kafka 로깅 적절히
    org.elasticsearch: DEBUG  # Elasticsearch 디버깅
    org.springframework.ai: DEBUG  # Spring AI 디버깅

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        # LLM 호출 지표(gen_ai.client.*) 확인용으로 health·metrics만 연다. 게이트웨이 밖으로 열리는지는 배포 설정에서 확인
        include: health,metrics
  endpoint:
    health:
      show-details: always
      enabled: true
  health:
    elasticsearch:
      enabled: false  # Elasticsearch Java client 8.13.3과 호환성 문제로 비활성화
