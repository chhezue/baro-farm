plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.diffplug.spotless'
    id 'checkstyle'
}

group = 'com.barofarm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    set('springCloudVersion', "2025.0.0")
    set('springAiVersion', "1.1.8")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
    // ES 클라이언트 버전 고정 — 해제는 인프라 담당자의 서버 버전(운영 9.1.2) 확인 후.
    // 근거·해제 절차: docs/audits/cross-cutting/002-dependencies-config-and-dead-code.md B-8
    dependencies {
        dependency 'org.springframework.data:spring-data-elasticsearch:5.3.6'
        dependency 'org.springframework.data:spring-data-commons:3.3.6'
    }
}

configurations.all {
    resolutionStrategy {
        force 'co.elastic.clients:elasticsearch-java:8.13.3'
    }
}

dependencies {
    // ========= 공통 / 개발 편의 =========
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger(OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // ========= AI 서비스 공통 인프라 =========
    implementation project(':baro-common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // ========= Elasticsearch / 벡터 스토어 =========
    implementation('org.springframework.boot:spring-boot-starter-data-elasticsearch') {
        exclude group: 'co.elastic.clients', module: 'elasticsearch-java'
    }
    implementation 'co.elastic.clients:elasticsearch-java:8.13.3'

    // ========= 메시징 / Kafka =========
    implementation 'org.springframework.kafka:spring-kafka'

    // ========= 캐시 (로컬, 자동완성 전용 — docs/decisions/001-autocomplete-caching.md) =========
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // Spring AI가 이미 갖춘 LLM 호출 관측 훅(토큰·지연·오류 지표)을 켜기 위한 것. 근거: docs/audits/cross-cutting/audit.md B-1
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ========= Spring AI (Google Gemini — 챗·임베딩 모두) =========
    // 근거: docs/decisions/003-gemini-migration.md
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    enabled = true
    mainClass = 'com.barofarm.ai.AiApplication'
}

jar {
    enabled = false
}
